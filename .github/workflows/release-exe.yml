name: Build flexScript.exe

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --name flexScript flexScript.py
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/flexScript.exe flexScript.py --clobber
        env:
          GH_TOKEN: ${{ github.token }}
